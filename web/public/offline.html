<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nashr: offline</title>
<meta name="theme-color" content="#0b0b0c">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ffffff;color:#0b0b0c;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:24px;text-align:center}
main{max-width:420px}img{width:72px;height:72px;border-radius:12px}h1{font-size:22px;font-weight:600;margin:16px 0 8px}p{margin:0 0 8px;color:#55534f}
button{margin-top:16px;padding:11px 22px;border:0;border-radius:6px;background:#0b0b0c;color:#fff;font:inherit;font-weight:600}button:focus-visible{outline:2px solid #0b0b0c;outline-offset:2px}
[lang=ar] body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif}.ar{display:none}[lang=ar] .ar{display:block}[lang=ar] .en{display:none}@media (prefers-color-scheme:dark){body{background:#0b0b0c;color:#fff}p{color:#b9b7b2}button{background:#fff;color:#0b0b0c}button:focus-visible{outline-color:#fff}}</style>
<script>try{if(localStorage.getItem('nashr:lang')==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl';document.title='نشر: لا يوجد اتصال'}}catch(e){}</script></head>
<body><main><img src="/icon-192.png" alt="">
<div class="en"><h1>You are offline</h1><p>Nashr needs a connection to show bookings, bids and payments. Check your connection and try again.</p><button onclick="location.reload()">Try again</button></div>
<div class="ar"><h1>لا يوجد اتصال</h1><p>يحتاج نشر إلى الإنترنت لعرض الحجوزات والعروض والدفعات. تحقق من اتصالك وحاول مجددًا.</p><button onclick="location.reload()">حاول مجددًا</button></div>
</main></body></html>
