<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nashr: offline</title>
<meta name="theme-color" content="#1e1650">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f8;color:#0d0c1d;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:24px;text-align:center}
main{max-width:420px}img{width:72px;height:72px;border-radius:16px}h1{font-size:22px;margin:16px 0 8px}p{margin:0 0 8px;color:#5e5b72}
button{margin-top:16px;padding:11px 22px;border:0;border-radius:10px;background:#6b3cf6;color:#fff;font:inherit;font-weight:600}button:focus-visible{outline:3px solid #a98bff;outline-offset:2px}
[lang=ar] body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif}.ar{display:none}[lang=ar] .ar{display:block}[lang=ar] .en{display:none}</style>
<script>try{if(localStorage.getItem('nashr:lang')==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl';document.title='نشر: لا يوجد اتصال'}}catch(e){}</script></head>
<body><main><img src="/icon-192.png" alt="">
<div class="en"><h1>You are offline</h1><p>Nashr needs a connection to show bookings, bids and payments. Check your connection and try again.</p><button onclick="location.reload()">Try again</button></div>
<div class="ar"><h1>لا يوجد اتصال</h1><p>يحتاج نشر إلى الإنترنت لعرض الحجوزات والعروض والدفعات. تحقق من اتصالك وحاول مجددًا.</p><button onclick="location.reload()">حاول مجددًا</button></div>
</main></body></html>
