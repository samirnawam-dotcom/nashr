# Auto-deploy to nashr.pro (Namecheap cPanel shared hosting) on every push to the working branch.
# Tests first: if anything fails, nothing is deployed and the live site is untouched.
# Then: build the package, copy it to ~/nashr over SSH (data, uploads, logs and demo-credentials.txt are never touched),
# restart the app, and check /api/health. Set-up (one-off): docs/deploy-cpanel.md, "Automatic deploys".
#
# Repository secret: NASHR_KEY, the private key whose public half is authorised in cPanel > SSH Access
# (CPANEL_SSH_KEY works too). The server and the cPanel user are not secret, so they are set below in env;
# secrets CPANEL_HOST / CPANEL_USER override them. Not nashr.pro as the host: Cloudflare does not pass SSH.
name: Deploy to nashr.pro

on:
  push:
    branches: [claude/zealous-wright-qlxrhi]
  workflow_dispatch: {}

concurrency:
  group: deploy-nashr-pro
  cancel-in-progress: false # never stop a deploy half-way; the next one waits

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: nashr, POSTGRES_PASSWORD: nashr, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U nashr" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://nashr:nashr@localhost:5432/nashr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SSH_PORT: '21098' # Namecheap shared hosting's SSH port
      HOST: ${{ secrets.CPANEL_HOST || 'premium82.web-hosting.com' }}
      CP_USER: ${{ secrets.CPANEL_USER || 'nashbjis' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Build the package
        run: VITE_SITE_URL=https://nashr.pro node scripts/build-cpanel.mjs

      - name: Set up SSH
        env:
          KEY: ${{ secrets.NASHR_KEY || secrets.CPANEL_SSH_KEY }}
        run: |
          test -n "$KEY" || { echo "Add the NASHR_KEY repository secret: the deploy key's private half (docs/deploy-cpanel.md)."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/cpanel && chmod 600 ~/.ssh/cpanel
          ssh-keyscan -p "$SSH_PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy to the server
        # A plain archive over SSH (rsync fails on shared hosting: the login shell prints a banner into rsync's protocol).
        # It is unpacked into nashr-next first, then each part is swapped in, so the live folder is never half-written;
        # only the build's own parts are replaced: data, uploads, logs, demo-credentials.txt, tmp/ and public/ stay.
        # pipefail and the "Installed:" check: a host that refuses shell commands must fail the deploy, not pass it silently.
        run: |
          set -o pipefail
          tar -C release/nashr -czf - . | ssh -i ~/.ssh/cpanel -p "$SSH_PORT" "$CP_USER@$HOST" '
            set -e
            rm -rf nashr-next && mkdir -p nashr-next nashr && tar -xzf - -C nashr-next
            for d in server site migrations web; do
              rm -rf "nashr/$d.old"; if [ -e "nashr/$d" ]; then mv "nashr/$d" "nashr/$d.old"; fi; mv "nashr-next/$d" "nashr/$d"
            done
            cp -f nashr-next/app.js nashr-next/package.json nashr-next/VERSION.txt nashr/
            rm -rf nashr-next nashr/*.old
            echo "Installed: $(cat nashr/VERSION.txt)"' | tee copy.log
          grep -q '^Installed: ' copy.log || { echo "The server did not unpack the files. If it says shell access is not enabled, ask Namecheap support to enable SSH shell access."; exit 1; }

      - name: Restart the app
        run: |
          ssh -i ~/.ssh/cpanel -p "$SSH_PORT" "$CP_USER@$HOST" \
            'cloudlinux-selector restart --json --interpreter nodejs --app-root nashr || { mkdir -p nashr/tmp && touch nashr/tmp/restart.txt; }; echo restarted' \
            | tee restart.log
          grep -q '^restarted' restart.log || { echo "The server did not run the restart (shell access)."; exit 1; }

      - name: Check the live site
        # healthy AND running this commit (the build stamps it into /api/health), so the old copy cannot pass for the new one
        run: |
          want="$(git rev-parse --short=12 HEAD)"
          for i in $(seq 1 18); do
            body="$(curl -fsS https://nashr.pro/api/health || true)"
            case "$body" in *'"ok":true'*'"build":"'"$want"'"'*) echo "Live: $body"; exit 0;; esac
            sleep 10
          done
          echo "The site did not report healthy on build $want within 3 minutes. Last answer: $body"
          echo "Look at ~/nashr/stderr.log in cPanel File Manager."
          exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/cpanel
